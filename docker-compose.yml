version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - SMTP_USER=${SMTP_USER}
      - N8N_ENV_VARS_EXPOSED=SMTP_USER
      - CREDENTIALS_OVERWRITE_DATA={"imap":{"IMAP account":{"user":"${IMAP_USER}","password":"${IMAP_PASS}","host":"${IMAP_HOST}","port":993,"ssl":true}},"smtp":{"SMTP account":{"user":"${SMTP_USER}","password":"${SMTP_PASS}","host":"${SMTP_HOST}","port":587,"secure":false}}}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai_responder_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_responder_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama-pull:
    image: ollama/ollama
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai_responder_net
    environment:
      - OLLAMA_HOST=ollama:11434
    command: pull llama3:8b

volumes:
  n8n_data:
  ollama_data:

networks:
  ai_responder_net:
    driver: bridge
